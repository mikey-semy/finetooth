name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Тесты ставят набор во временные git-репозитории и дёргают командную строку,
      # поэтому git обязан уметь коммитить: в чистом раннере имени и почты нет.
      - name: Настроить git
        run: |
          git config --global user.email "tests@example.com"
          git config --global user.name "finetooth tests"
          git config --global init.defaultBranch master
      - name: Прогнать тесты
        run: python3 -m unittest discover -s tests -v
      # Формат скилла — тем же валидатором, что предлагает спецификация Agent Skills.
      # Юнит-тесты повторяют часть его правил, но не заменяют его: разбор YAML-шапки и
      # полный набор ограничений живут в нём.
      - name: Проверить формат скилла
        run: |
          python3 -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install --quiet "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/skills-ref" validate skills/finetooth
