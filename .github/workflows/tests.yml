name: tests

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    # Приговор набора не должен зависеть от машины. Имя, почту и имя ветки стенд задаёт
    # себе сам (глобальный конфиг git у его потомков отключён), а локаль задаётся здесь:
    # имена тестов и сообщения коммитов не-ASCII, и в локали C без режима UTF-8 прогон
    # рассыпается двумя сотнями UnicodeEncodeError.
    env:
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v5
      - name: Прогнать тесты
        run: python3 -m unittest discover -s tests -v
      # Формат скилла — тем же валидатором, что предлагает спецификация Agent Skills.
      # Юнит-тесты повторяют часть его правил, но не заменяют его: разбор YAML-шапки и
      # полный набор ограничений живут в нём.
      - name: Проверить формат скилла
        run: |
          python3 -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install --quiet "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/skills-ref" validate skills/finetooth
