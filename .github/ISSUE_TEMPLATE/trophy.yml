name: Трофей — дефект, найденный набором
description: Настоящий дефект, который нашло ревью по этому методу. Это знаменатель для оценки метода
labels: [trophy]
body:
  - type: dropdown
    id: role
    attributes:
      label: Какой шаг нашёл
      options: [охотник, проверяющий, ревьюер правок, гейт check, карта покрытия]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что за дефект
      description: класс и сценарий отказа, обезличенно — без имени проекта и внутренних деталей, если они закрыты
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Ссылка на находку или починку
      description: если проект открытый
  - type: textarea
    id: why
    attributes:
      label: Почему другие методы его не нашли бы
      description: необязательно, но это самое ценное
