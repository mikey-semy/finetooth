name: Tool defect
description: check goes green on a false state, prompt assembles the wrong thing, a command crashes
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: output of `python3 <skill>/scripts/review.py version`
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: commands in order on a fresh temporary repository — as in tests/test_review.py
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected and what happened
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: State (if relevant)
      description: pieces of blocks.json / state.json / findings.jsonl without other people's data
