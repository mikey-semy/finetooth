name: Change proposal
description: A new check, role or command — with the gap it closes
labels: [proposal]
body:
  - type: textarea
    id: gap
    attributes:
      label: Which gap
      description: what currently passes unnoticed; preferably with a real case
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How to close it
      description: a mechanism, not a wish; and how the neighbouring tools do it, if they do
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: How it would be proven
      description: >-
        which gate would go red on the defect, and the mutation that proves the gate —
        every check here comes with a test, and the test with a mutation (CONTRIBUTING.md).
        The plan itself lives in a private knowledge base, so do not look for a direction
        number: the maintainer places the proposal against it.
