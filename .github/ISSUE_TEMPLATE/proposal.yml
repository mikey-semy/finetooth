name: Change proposal
description: A new check, role or command — with the gap it closes
labels: [proposal]
body:
  - type: textarea
    id: gap
    attributes:
      label: Which gap
      description: what currently passes unnoticed; preferably with a real case
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How to close it
      description: a mechanism, not a wish; how the neighbours do it (see docs/prior-art.md), if they do
    validations:
      required: true
  - type: textarea
    id: roadmap
    attributes:
      label: Which ROADMAP direction
      description: the number, if one fits; otherwise — why a new one is needed
