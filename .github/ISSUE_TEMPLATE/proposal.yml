name: Предложение изменения
description: Новая проверка, роль, команда — с тем, какую дыру она закрывает
labels: [proposal]
body:
  - type: textarea
    id: gap
    attributes:
      label: Какая дыра
      description: что сейчас проходит незамеченным; лучше с реальным случаем
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: Как закрыть
      description: механизм, а не пожелание; как это делают соседи (см. docs/prior-art.md), если делают
    validations:
      required: true
  - type: textarea
    id: roadmap
    attributes:
      label: Какое направление ROADMAP
      description: номер, если подходит; иначе — почему нужно новое
