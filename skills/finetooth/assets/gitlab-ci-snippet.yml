# The review in GitLab CI. Pasted into the project's .gitlab-ci.yml.
#
# Two jobs:
#   review-check      — `review.py check`: the review state is consistent — statuses, reports,
#                       the register, the coverage map, and no open finding whose file changed
#                       since it was read. Where nobody watches the interface and an agent
#                       merges, this job is the only gate: make it required ("Pipelines must
#                       succeed" in the merge request settings).
#   review-discussion — the open findings on the lines a merge request adds or changes, as
#                       merge request discussions, through reviewdog. Works on every GitLab
#                       tier: it posts through the notes API, not through a security report.
#
# Why reviewdog and not the native SARIF report: GitLab reads SARIF
# (`artifacts:reports:sarif`) on the Ultimate tier only — generally available since GitLab
# 19.2; on Free and Premium it is not shown anywhere. On Ultimate, review-check can also run
# `python3 "$REVIEW" sarif --out finetooth.sarif` with
# `artifacts: {reports: {sarif: finetooth.sarif}}`; GitLab then skips the deferred findings
# (it drops a result whose suppression is accepted), which is what "accepted risk" means.
# reviewdog drops them the same way, so a discussion is never opened on an accepted risk.
#
# Sources: https://docs.gitlab.com/user/application_security/detect/sarif/ and
# https://github.com/reviewdog/reviewdog (README: "Reporter: GitLab MergeRequest discussions",
# "Filter mode"; the SARIF reader is parser/sarif.go).

# The path to the tool is where the skill was installed into the project; change REVIEW if
# yours is elsewhere. The image is the official Python one: it carries git, which the tool
# reads the repository through, and curl.

.finetooth:
  stage: test
  image: python:3.12
  variables:
    REVIEW: .claude/skills/finetooth/scripts/review.py
    # The whole history: `check` follows fix commits and the main line through git, and
    # reviewdog runs `git diff` from the merge request's base; GitLab clones 20 commits
    # deep by default.
    GIT_DEPTH: "0"

review-check:
  extends: .finetooth
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - python3 "$REVIEW" check

# REVIEWDOG_GITLAB_API_TOKEN: an access token with the `api` scope (reviewdog's README asks
# for it), stored as a CI/CD variable — masked, NOT protected: a merge request pipeline runs
# on an unprotected branch and would not see a protected one. Anyone who can push a branch
# can read such a variable from a pipeline, so give it a project access token made for this
# job, not your personal one. Without the variable the job does not run (the rule below);
# a merge request from a fork runs in the fork's project, without it, too.
#
# reviewdog is a release archive checked against a SHA-256 written here, not the install
# script: the script checks the archive against checksums.txt from the same release, which
# guards against a broken download but not against a replaced release. To update, change
# both lines — the digest is the Linux_x86_64 line of the release's checksums.txt (on an
# arm64 runner take the Linux_arm64 archive and its line).
#
# -filter-mode=added posts only findings on lines this merge request adds or changes: an
# open finding the change does not touch stays in docs/review/findings.md and is not
# re-posted on every merge request. A discussion reviewdog posted earlier is not posted
# twice. The exit code stays 0 (-fail-level=none, the default): the gate is review-check.

review-discussion:
  extends: .finetooth
  variables:
    REVIEWDOG_VERSION: "0.21.2"
    REVIEWDOG_SHA256: "30413aa3c7443e9c3c157fe5766cad40e3bb39a32e210ee69b710a8d5c4b8e51"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $REVIEWDOG_GITLAB_API_TOKEN
  script:
    - python3 "$REVIEW" sarif --out finetooth.sarif
    - curl -sSfL -o reviewdog.tar.gz
      "https://github.com/reviewdog/reviewdog/releases/download/v${REVIEWDOG_VERSION}/reviewdog_${REVIEWDOG_VERSION}_Linux_x86_64.tar.gz"
    - echo "${REVIEWDOG_SHA256}  reviewdog.tar.gz" | sha256sum -c -
    - tar -xzf reviewdog.tar.gz reviewdog
    - ./reviewdog -f=sarif -name=finetooth -reporter=gitlab-mr-discussion -filter-mode=added
      < finetooth.sarif
